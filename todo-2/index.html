<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f3">
    <title>Mis tareas</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="app-shell">
        <section class="app-card" aria-labelledby="app-title">
            <header class="app-header">
                <div>
                    <p class="eyebrow">LISTA PERSONAL</p>
                    <h1 id="app-title">Mis tareas</h1>
                    <p class="date-label" id="today-label"></p>
                </div>
                <div class="task-summary" aria-live="polite">
                    <strong id="pending-count">0</strong>
                    <span>pendientes</span>
                </div>
            </header>

            <form class="task-form" id="task-form">
                <label class="sr-only" for="task-input">Nueva tarea</label>
                <input id="task-input" name="task" type="text" maxlength="120" placeholder="¿Qué necesitas hacer?" autocomplete="off" required>
                <button class="add-button" type="submit"><span aria-hidden="true">+</span> Agregar</button>
            </form>

            <nav class="filters" aria-label="Filtrar tareas">
                <button class="filter-button is-active" type="button" data-filter="all">Todas <span id="all-count">0</span></button>
                <button class="filter-button" type="button" data-filter="active">Pendientes <span id="active-count">0</span></button>
                <button class="filter-button" type="button" data-filter="completed">Completadas <span id="completed-count">0</span></button>
            </nav>

            <section class="task-list" id="task-list" aria-live="polite" aria-label="Tareas"></section>

            <footer class="app-footer">
                <span id="footer-message">Todo en orden.</span>
                <button class="clear-button" id="clear-completed" type="button">Borrar completadas</button>
            </footer>
        </section>
        <p class="storage-note"><span aria-hidden="true">✓</span> Guardado automático en este dispositivo</p>
    </main>
    <script src="script.js"></script>
</body>
</html>
